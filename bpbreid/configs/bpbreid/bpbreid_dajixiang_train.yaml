data:
  root: '/root/autodl-tmp/MOT_WITH_PMMM/bpbreid/datasets'
  sources: ['dajixiang']
  targets: ['dajixiang']
  height: 256
  width: 256
  transforms: ['rc', 're']

model:
  name: 'bpbreid'
  pretrained: False
  bpbreid:
    mask_filtering_training: False
    mask_filtering_testing: True
    learnable_attention_enabled: True
    backbone: 'osnet_x1_0'
    test_embeddings: ['bn_foreg', 'parts']
    masks:
      dir: 'pifpaf_maskrcnn_filtering'
      preprocess: 'five_v'

loss:
  name: 'part_based'
  triplet:
    weight_t: 1.0
    weight_x: 1.0
  part_based:
    name: 'part_averaged_triplet_loss'
    ppl: 'cl'
    weights:  # SOTA weights for GiLt loss
      globl:
        id: 1.
        tr: 0.
      foreg:
        id: 1.
        tr: 1.
      conct:
        id: 1.
        tr: 0.
      parts:
        id: 0.
        tr: 1.
      pixls:
        ce: 0.35

train:
  batch_size: 64
  max_epoch: 120

test:
  evaluate: False
  batch_size: 32
  visrank: True
